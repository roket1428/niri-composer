[package]
name = "niri-composer"
description = "A composer daemon for niri wayland compositor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
lexopt = "0.3.2"
memchr = "2.8.3"
niri-ipc = "26.4.0"
serde = { version = "1.0.151", default-features = false, features = [ "derive" ] }
serde_json = "1.0.151" 
thiserror = "2.0.21"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util"] }
