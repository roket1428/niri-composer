[package]
name = "niri-composer"
description = "A composer daemon for niri wayland compositor"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
memchr = "2.8.3"
lexopt = "0.3.2"

# kdl parsing and error reporting libs that match niri upstream
knuffel = "3.2.0"
miette = { version = "5.10.0", features = ["fancy-no-backtrace"] }
thiserror = "2.0.21"

# pulls shit ton of deps
# but dont want to maintain config defs
# and lto prunes them anyways
niri-config = {
  git = "https://github.com/niri-wm/niri.git",
  rev = "45739bc072f9875a674d335ae724f10d3b35c665",
  package = "niri-config"
}
niri-ipc = {
  git = "https://github.com/niri-wm/niri.git",
  rev = "45739bc072f9875a674d335ae724f10d3b35c665",
  package = "niri-ipc"
}

serde = { version = "1.0.151", default-features = false, features = [ "derive" ] }
serde_json = "1.0.151" 
thingbuf = { version = "0.1.6", default-features = false, features = [ "alloc" ] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util"] }
notify-debouncer-full = "0.7.0"
notify = { version = "8.2.0", default-features = false }
directories = "6.0.0"
